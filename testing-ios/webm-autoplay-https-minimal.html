<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GRAPHIC HAVOC — Minimal WebM Autoplay Test</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #272727;
      color: #F9FBFD;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    main { padding: 20px; }
    video {
      display: block;
      width: 100%;
      height: auto;
      background: #111;
    }
    p { font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <p>Minimal HTTPS autoplay test — no loader, no JavaScript playback code.</p>
    <video
      src="../assets/graphichavoc-work-hero.webm"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>
  </main>
</body>
</html>
